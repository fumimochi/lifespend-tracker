<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="./profile.css" />
    <script type="module" src="./profile.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="topbar__logo">Life<span>Spend</span></div>
        <nav class="topbar__nav">
          <a href="index.html">Home</a>
          <a href="sign-up-page/sign-up.html">Statistic</a>
        </nav>
        <div class="topbar__controls">
          <select name="month" id="select_month">
            <option value="Jun">June 2026</option>
            <option value="Jul">July 2026</option>
          </select>
          <button class="avatar-btn hovering">VP</button>
        </div>
      </header>
      <main class="layout">
        <div class="left-bar">
          <div class="profile">
            <p class="profile-label">Profile</p>
            <img src="" class="profile-image" />
            <p class="profile-nickname">Vladyslav</p>
            <p class="profile-email">vlad@example.com</p>
            <section>
              <label for="name">NAME</label>
              <input type="text" id="name" placeholder="Vladyslav" />
              <label for="email">EMAIL</label>
              <input type="email" id="email" placeholder="vlad@example.com" />
              <label for="budget">MONTH BUDGET ₴</label>
              <input type="number" id="budget" value="1200" />
              <button class="save-info-btn hovering">Save changes</button>
              <button class="delete-acc-btn hovering">Delete account</button>
            </section>
          </div>
        </div>
        <div class="right-bar">
          <div class="right__stat">
            <p>Account statistic</p>
            <table>
              <tr>
                <td>Total spends</td>
                <td>8</td>
              </tr>
              <tr>
                <td>Total money spent</td>
                <td>₴870</td>
              </tr>
              <tr>
                <td>Best month</td>
                <td>June</td>
              </tr>
              <tr>
                <td>Account created</td>
                <td>January 2026</td>
              </tr>
            </table>
          </div>
          <div class="right__sec">
            <p>Security</p>
            <section>
              <label for="current">CURRENT PASSWORD</label>
              <input type="password" id="current" />
              <label for="new-pass">NEW PASSWORD</label>
              <input type="password" id="new-pass" />
              <button class="change-pass-btn hovering">Change password</button>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
