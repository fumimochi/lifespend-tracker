<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="statistic.css" />
    <title>Statistic</title>
    <script type="module" src="./statistic.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="topbar__logo">Life<span>Spend</span></div>
        <nav class="topbar__nav">
          <a href="index.html">Home</a>
          <a href="sign-up-page/sign-up.html">Statistic</a>
        </nav>
        <div class="topbar__controls">
          <select name="month" id="select_month">
            <option value="Jun">June 2026</option>
            <option value="Jul">July 2026</option>
          </select>
          <button class="avatar-btn">VP</button>
        </div>
      </header>
      <main class="layout">
        <div class="short-stat">
          <div class="cell">
            <p class="short-stat__label">
              Total for <span class="label"></span>
            </p>
            <p class="short-stat__cost cost-total"></p>
            <p><span class="short-stat__count"></span> transactions</p>
          </div>
          <div class="cell">
            <p class="short-stat__label">Average spend</p>
            <p class="short-stat__cost"><span class="cost-avg"></span></p>
            <p>for each transaction</p>
          </div>
          <div class="cell">
            <p class="short-stat__label">The highest spend</p>
            <p class="short-stat__cost"><span class="cost-highest"></span></p>
            <p><span class="short-stat__date"></span></p>
          </div>
        </div>
        <div class="graph">
          <div class="graph-categories cell">
            <h3>By category</h3>
            <ul></ul>
          </div>
          <div class="graph-budget cell">
            <h3 class="graph-budget__title">Budget for <span>June</span></h3>

            <div class="graph-budget__spent-row">
              <div class="graph-budget__spent-quantity">
                <span>Spent</span>
                <span class="graph-budget__spent-left"></span>
                /
                <span class="graph-budget__spent-total"></span>
              </div>

              <progress
                class="graph-budget__progress"
                max="100"
                value="70"
              ></progress>

              <div class="graph-budget__meta">
                <span class="graph-budget__percent"></span>
                <div>
                  <span>left</span>
                  <span class="graph-budget__left">₴358</span>
                </div>
              </div>

              <hr class="graph-budget__divider" />

              <h3 class="graph-budget__subtitle">By day of week</h3>

              <div class="graph-budget__bars"></div>
            </div>
          </div>
        </div>
        <div class="top-spends cell">
          <div class="top-spends__title">
            <h3>Top spends for this month</h3>
          </div>
          <div class="top-spends__table">
            <table></table>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
